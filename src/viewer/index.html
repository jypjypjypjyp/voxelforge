<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>voxelforge viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #dfe3ea;
    font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 10px; left: 12px; right: 12px; z-index: 2;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    background: rgba(20,22,26,.78); padding: 6px 12px; border-radius: 10px; }
  #hud { opacity: .85; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: flex; }
  #bar button { border: 0; padding: 3px 12px; cursor: pointer; font: inherit;
    color: #9aa3ad; background: #262b33; }
  #bar button:hover { background: #313845; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.active { background: #3d4c5f; color: #dfe3ea; }
  #bar label { display: flex; align-items: center; gap: 6px; color: #9aa3ad; }
  #bar input[type="range"] { width: 110px; }
</style>
</head>
<body>
<div id="bar">
  <span id="hud">加载中…</span>
  <div class="seg">
    <button id="modeVoxelBtn" class="active">体素</button>
    <button id="modeMeshBtn">平滑</button>
  </div>
  <label id="resWrap" style="display:none;">分辨率
    <input id="resSlider" type="range" min="8" max="128" value="64">
    <span id="resVal">64</span>
  </label>
  <label id="smoothWrap" style="display:none;">平滑度
    <input id="smoothSlider" type="range" min="0" max="8" value="1">
    <span id="smoothVal">1</span>
  </label>
  <button id="exportBtn" title="导出当前视图为 GLB（平滑模式自动带调色板贴图+UV）">导出 GLB</button>
</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
